<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Talria Limited DMCC Forms</title>
</head>
<body>
  <!-- Static HTML form skeleton for Netlify build bot detection in TanStack Start SSR -->
  <form name="talria-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="talria-inquiry" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="organization" />
    <input type="text" name="country" />
    <input type="text" name="inquiryType" />
    <input type="text" name="productInterest" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
